<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d12; }
      #root { position: relative; width: 100%; height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; color: #f2f3f5; }
      #card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; }
      #kicker { font-size: 40px; font-weight: 700; letter-spacing: 0.18em; color: #7dd3c0; }
      .line { display: block; font-size: 128px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; }
      #bar { display: block; width: 520px; height: 18px; margin-top: 48px; background: #f6c177; transform-origin: left center; }
      #sub { margin-top: 40px; font-size: 44px; color: #a9afbd; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <section id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="kicker">INDIA vs DUBAI</div>
        <div id="l1" class="line">Same iPhone,</div>
        <div id="l2" class="line">₹20,000 more.</div>
        <div id="bar"></div>
        <div id="sub">Here's where the money goes.</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#l1", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 0.45);
      tl.fromTo("#l2", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 0.75);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 1.3);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
