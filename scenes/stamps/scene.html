<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>#__ID__-root { position: absolute; inset: 0; overflow: hidden; }</style>
      <div id="__ID__-root" data-composition-id="__ID__" data-width="1080" data-height="1920" data-duration="__DUR__"><div id="__ID__-host" style="position:absolute;inset:0"></div></div>
      <script>
        /* stamps: index cards (names) that each get a rubber stamp (OFFLINE, BANNED, SOLD OUT...) on cue.
           Beats: deal (cards fly in), stamp (i: one card, or all in turn with stagger). */
        (() => {
          const D = __DATA__;
          const DUR = __DUR__;
          const items = D.items.slice(0, 6);
          const sc = FF.scene("__ID__", D, DUR, { seed: 33, defaultBeats: [{ do: "deal" }, { do: "stamp", stagger: 0.3 }] });
          const { s, k, C, tl } = sc;
          FF.kicker(sc, D.kicker);
          const cols = items.length > 3 ? 2 : 1;
          const rows = Math.ceil(items.length / cols);
          const CW = cols === 2 ? 450 : 760, CH = Math.min(250, 840 / rows - 30);
          const x0 = 540 - (cols * CW + (cols - 1) * 40) / 2, y0 = 400;
          const r = FF.rng(5);
          const cards = items.map((it, i) => {
            const col = i % cols, row = Math.floor(i / cols);
            const x = x0 + col * (CW + 40), y = y0 + row * (CH + 30);
            const rot = (r() * 2 - 1) * 3;
            const g = FF.el("g", { opacity: 0 }, s);
            k.rect(g, x, y, CW, CH, { fill: C.fill, r: 10 });
            k.line(g, x + 24, y + 58, x + CW - 24, y + 58, { stroke: C.accent, width: 2.5, roughness: 0.5 });
            const name = FF.text(g, x + 30, y + 104, it.name, { size: 54, anchor: "start", font: FF.tok("--ff-display") });
            FF.fitText(name, CW - 60, 54);
            if (it.note) { const n = FF.text(g, x + 30, y + 32, it.note, { size: 30, anchor: "start", fill: C.muted }); FF.fitText(n, CW - 60, 30); }
            const stamp = FF.el("g", { opacity: 0 }, s);
            const sw = Math.min(CW * 0.62, 300), sh = 78;
            const cx = x + CW - sw / 2 - 22, cy = y + CH - sh / 2 - 12;
            stamp.setAttribute("data-layout-allow-overlap", "");
            k.rect(stamp, cx - sw / 2, cy - sh / 2, sw, sh, { fill: "none", stroke: C.red, width: 7, r: 8 });
            const st = FF.text(stamp, cx, cy + 4, D.stamp || "OFFLINE", { size: 52, fill: C.red, font: FF.tok("--ff-display") });
            FF.fitText(st, sw - 30, 60);
            FF.pivot(stamp, cx, cy);
            FF.pivot(g, x + CW / 2, y + CH / 2);
            return { g, stamp, rot, cx, cy, x, y, name };
          });
          sc.beats.forEach((b, i) => {
            const t = sc.when(b, i);
            if (b.do === "deal") {
              cards.forEach((c, j) => {
                tl.set(c.g, { opacity: 1 }, t + j * 0.08);
                tl.fromTo(c.g, { x: j % 2 ? 700 : -700, rotation: c.rot * 6 }, { x: 0, rotation: c.rot, duration: 0.35, ease: "power3.out" }, t + j * 0.08);
              });
            } else if (b.do === "stamp") {
              const which = b.i !== undefined ? [b.i] : cards.map((_, j) => j);
              which.forEach((j, n) => {
                const c = cards[j];
                if (!c) return;
                const tt = t + n * (b.stagger ?? 0.3);
                tl.set(c.stamp, { opacity: 1 }, tt);
                tl.fromTo(c.stamp, { scale: 2.4, rotation: -26 }, { scale: 1, rotation: -11, duration: 0.16, ease: "power4.in" }, tt);
                tl.to(c.name, { color: C.muted, duration: 0.1 }, tt + 0.16);
                FF.shake(tl, sc.shaker, tt + 0.16, 0.16, 7, 40 + n);
              });
            }
          });
          sc.finish();
        })();
      </script>
    </template>
  </body>
</html>
