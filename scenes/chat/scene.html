<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #__ID__-root { position: absolute; inset: 0; overflow: hidden; }
        .__ID__-win { position: absolute; left: 90px; right: 90px; top: 380px; height: 820px; border: 6px solid var(--ff-ink); border-radius: 30px;
          background: var(--ff-fill); transform: rotate(-1deg); overflow: hidden; }
        .__ID__-head { height: 96px; border-bottom: 5px solid var(--ff-ink); display: flex; align-items: center; gap: 18px; padding: 0 32px;
          font: 700 44px/1 var(--ff-hand); color: var(--ff-fg); background: var(--ff-fill-2); }
        .__ID__-head b { width: 26px; height: 26px; border-radius: 50%; background: var(--ff-accent); display: block; }
        .__ID__-b { position: absolute; max-width: 700px; padding: 26px 32px; border: 5px solid var(--ff-ink); border-radius: 30px;
          font: 700 52px/1.2 var(--ff-hand); color: var(--ff-fg); white-space: pre-wrap; min-height: 1.2em; }
        .__ID__-me { right: 34px; top: 140px; background: var(--ff-lit); border-bottom-right-radius: 6px; }
        .__ID__-ai { left: 34px; top: 420px; background: var(--ff-bg); border-bottom-left-radius: 6px; opacity: 0; }
        .__ID__-note { position: absolute; left: 0; right: 0; top: 1236px; text-align: center; font: 700 46px/1 var(--ff-hand); color: var(--ff-fg); }
        .__ID__-dots { position: absolute; left: 34px; top: 420px; width: 200px; height: 104px; border: 5px solid var(--ff-ink); border-radius: 30px;
          border-bottom-left-radius: 6px; background: var(--ff-bg); font: 700 70px/80px var(--ff-display); color: var(--ff-muted); text-align: center;
          opacity: 0; letter-spacing: 0.15em; }
      </style>
      <div id="__ID__-root" data-composition-id="__ID__" data-width="1080" data-height="1920" data-duration="__DUR__"><div id="__ID__-host" style="position:absolute;inset:0"></div></div>
      <script>
        /* chat: a hand-drawn chat with an AI. The prompt types out, the model "thinks", the reply types out.
           Beats: ask, think, reply, stamp. */
        (() => {
          const D = __DATA__;
          const DUR = __DUR__;
          const sc = FF.scene("__ID__", D, DUR, { seed: 55, defaultBeats: [{ do: "ask" }, { do: "think" }, { do: "reply" }] });
          const { s, k, C, tl } = sc;
          FF.kicker(sc, D.kicker);
          const win = document.createElement("div");
          win.className = "__ID__-win";
          win.innerHTML = `<div class="__ID__-head"><b></b>${D.title || "AI"}</div>`;
          const me = document.createElement("div"), ai = document.createElement("div"), dots = document.createElement("div");
          me.className = "__ID__-b __ID__-me";
          ai.className = "__ID__-b __ID__-ai";
          dots.className = "__ID__-dots";
          dots.textContent = "...";
          win.append(me, ai, dots);
          sc.html().appendChild(win);
          if (D.note) {   // e.g. "re-enactment": the reply is illustrative, not a transcript
            const n = document.createElement("div");
            n.className = "__ID__-note";
            n.textContent = D.note;
            sc.html().appendChild(n);
          }
          tl.fromTo(win, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.05);
          const stampG = FF.el("g", { opacity: 0 }, s);
          let askEnd = null;
          sc.beats.forEach((b, i) => {
            const t = sc.when(b, i);
            if (b.do === "ask") {
              askEnd = FF.type(tl, me, D.prompt, t, Math.max(b.cps ?? 34, 34));   // slow typing reads as dead air
              tl.fromTo(me, { scale: 1 }, { scale: 1.06, duration: 0.1, yoyo: true, repeat: 1, transformOrigin: "100% 100%" }, askEnd);   // "sent"
            } else if (b.do === "think") {
              // thinking starts as soon as the message is sent and runs until the reply: never a frozen window
              const from = askEnd !== null ? Math.min(t, askEnd + 0.25) : t;
              const replyAt = sc.beats.find((x) => x.do === "reply");
              const until = replyAt ? FF.at(D, replyAt.at, from + (b.dur ?? 0.9)) : from + (b.dur ?? 0.9);
              const d = Math.max(until - from, 0.3);
              tl.fromTo(dots, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)", transformOrigin: "0% 100%" }, from);
              tl.fromTo(dots, { y: 0 }, { y: -6, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(d / 0.3) - 1),
                onUpdate: function () { dots.textContent = ".".repeat(1 + (Math.floor(this.totalTime() / 0.2) % 3)); } }, from);
              tl.set(dots, { opacity: 0 }, from + d);
            } else if (b.do === "reply") {
              tl.set(ai, { opacity: 1 }, t);
              FF.type(tl, ai, D.reply, t, Math.max(b.cps ?? 42, 42));
            } else if (b.do === "stamp" && D.stamp) {
              stampG.innerHTML = "";
              k.rect(stampG, 300, 1150, 480, 120, { fill: C.bg, stroke: C.red, width: 8, r: 10 });
              const tt = FF.text(stampG, 540, 1212, D.stamp, { size: 66, fill: C.red, font: FF.tok("--ff-display") });
              FF.fitText(tt, 440, 66);
              tl.set(stampG, { opacity: 1 }, t);
              FF.pivot(stampG, 540, 1210);
              tl.fromTo(stampG, { scale: 2.2, rotation: -20 }, { scale: 1, rotation: -6, duration: 0.18, ease: "power4.in" }, t);
              FF.shake(tl, sc.shaker, t + 0.18, 0.25, 10, 8);
            }
          });
          // the SVG layer must sit above the chat window for the stamp
          sc.cam.appendChild(s);
          sc.finish();
        })();
      </script>
    </template>
  </body>
</html>
